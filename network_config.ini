# ============================================================================
# Конфигурация многопользовательского режима
# ============================================================================
# Режим работы программы:
#   local   - локальная база данных (по умолчанию)
#   network - база данных в сетевой папке (многопользовательский режим)
#   server  - через HTTP-сервер (устаревший режим)

[mode]
mode = network

# ============================================================================
# Настройки для режима "network"
# ============================================================================
[network]
# Путь к базе данных в сетевой папке
# Примеры:
#   \\SERVER\Share\Euroblock\euroblock.db
#   \\192.168.1.100\Общая\Euroblock\euroblock.db
#   Z:\Euroblock\euroblock.db  (если диск Z: подключен как сетевой)
db_path = \\SERVER\Share\Euroblock\euroblock.db

# Таймаут ожидания при блокировке БД (в секундах)
# Увеличьте при медленной сети
busy_timeout = 30

# Интервал проверки изменений БД от других клиентов (в секундах)
check_interval = 2

# ============================================================================
# Настройки для режима "server" (устаревший, для совместимости)
# ============================================================================
[server]
url = http://192.168.1.100:5000
timeout = 30